name: Importar versao de Pedro na branch isolada
on:
  push:
    branches:
      - pedro/versao-completa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    if: startsWith(github.event.head_commit.message, 'chore')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exclusivo da branch do grupo
        uses: actions/checkout@v4
        with:
          ref: pedro/versao-completa
          persist-credentials: true
      - name: Copiar versao completa do repositorio de origem
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --single-branch --branch apresentacao-contas-2026-11-19 https://github.com/ppedromartins11/busca-pet.git "$RUNNER_TEMP/buscapet-origem"
          origin_sha="$(git -C "$RUNNER_TEMP/buscapet-origem" rev-parse HEAD)"
          test "$origin_sha" = "d7194fdb3b779532aa980caeba1a4a15513936f5"
          cp .github/workflows/importar-versao-pedro.yml "$RUNNER_TEMP/importar-versao-pedro.yml"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          rsync -a --exclude='/.git/' --exclude='/.github/workflows/' "$RUNNER_TEMP/buscapet-origem/" ./
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/importar-versao-pedro.yml" .github/workflows/importar-versao-pedro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: copiar integralmente BuscaPet de Pedro (d7194fd)"
          git push origin HEAD:refs/heads/pedro/versao-completa
          echo "Origem importada: $origin_sha"
