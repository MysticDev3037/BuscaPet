<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuscaPet | Encontre, ajude, conecte</title>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* Estilo da Home Moderna */
    .hero-search {
      background: linear-gradient(135deg, #6d28e8, #914fe9);
      padding: 40px 20px;
      border-radius: 24px;
      color: white;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(109, 40, 232, 0.2);
    }
    .hero-search h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
      color: white;
    }
    .hero-search p {
      font-size: 16px;
      margin: 0 0 25px 0;
      opacity: 0.9;
    }
    .search-bar-big {
      display: flex;
      background: white;
      border-radius: 50px;
      padding: 5px 5px 5px 20px;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .search-bar-big input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 16px;
      padding: 10px 0;
      background: transparent;
    }
    .search-bar-big button {
      background: var(--p);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 0 25px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="phone app-shell">
    
    <!-- CABEÇALHO -->
    <header class="app-header">
      <a class="logo" href="index.html" aria-label="BuscaPet, início">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="6" cy="8" rx="2" ry="2.7"/><ellipse cx="11" cy="5" rx="2" ry="2.7"/><ellipse cx="17" cy="6" rx="2" ry="2.7"/><ellipse cx="20" cy="11" rx="1.8" ry="2.5"/><path d="M5 18c0-3 4-7 7-7s7 4 7 7c0 5-5 1-7 1s-7 4-7-1Z"/></svg>
        <span class="wordmark">Busca<strong>Pet</strong></span>
      </a>
      
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html" class="active">Início</a>
        <a href="mapa.html">Mapa</a>
        <a href="cadastro.html" class="post-link">+ Publicar</a>
        <a href="minha-area.html">Minha área</a>
      </nav>

      <div class="header-links">
        <a href="servicos.html">Rede de apoio</a>
        <span class="mode-pill">Tutor de pet</span>
      </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="page catalog-page">
      
      <!-- BANNER DE BUSCA -->
      <div class="hero-search">
        <h1>Quem você pode ajudar hoje?</h1>
        <p>Uma foto, uma pista, um reencontro. Faça parte dessa busca.</p>
        <div class="search-bar-big">
          <input id="search-input" type="text" placeholder="Nome, raça ou região...">
          <button>Buscar</button>
        </div>
      </div>

      <div class="browse-layout">
        <!-- FILTROS LATERAIS -->
        <aside class="browse-sidebar">
          <div class="filters-panel">
            <h3 style="margin-top:0; font-size:14px;">Filtros</h3>
            <div class="filter-controls">
              <label>Tipo
                <select id="filter-type">
                  <option value="todos">Todos</option>
                  <option value="perdido">Perdidos</option>
                  <option value="encontrado">Encontrados</option>
                </select>
              </label>
              <label>Região
                <select id="filter-region">
                  <option value="todos">Todas</option>
                  <option value="Centro">Centro</option>
                  <option value="Leste">Leste</option>
                  <option value="Bálsamo">Bálsamo</option>
                  <option value="Taveirópolis">Taveirópolis</option>
                </select>
              </label>
            </div>
          </div>
          
          <div class="support-note" style="margin-top: 20px;">
            <b>Você pode fazer a diferença.</b>
            <p>Viu um pet parecido? Abra o alerta e registre uma pista.</p>
            <a href="servicos.html">Conhecer a rede de apoio ↗</a>
          </div>
        </aside>

        <!-- LISTA DE PETS -->
        <div class="browse-results">
          <div class="catalog-toolbar">
            <div class="chips" role="group" aria-label="Filtrar por espécie">
              <button class="on" data-especie="todos">Todos</button>
              <button data-especie="cão">Cães</button>
              <button data-especie="gato">Gatos</button>
              <button data-especie="outro">Outros</button>
            </div>
            <span id="result-count" role="status" aria-live="polite">Carregando...</span>
          </div>
          
          <div id="results" class="list alert-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Área onde o menu global será injetado -->
  <div id="global-ui"></div>

  <!-- Script Global (cria o menu inferior, botões flutuantes e acessibilidade) -->
  <script src="global.js"></script>
  
  <!-- Script específico da Home (filtros e listagem de pets) -->
  <script src="app.js"></script> 
</body>
</html>
