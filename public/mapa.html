<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuscaPet | Mapa</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Biblioteca do Mapa (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Layout do Mapa */
    .map-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 100px);
      margin-top: 10px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    #mapa { flex: 1; width: 100%; z-index: 1; }

    /* Painel de Filtros Flutuante */
    .map-controls {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      background: white;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
    }
    
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .filter-header h3 { margin: 0; font-size: 16px; }
    .filter-header span { font-size: 20px; transition: transform 0.2s; }
    .filter-header.aberto span { transform: rotate(180deg); }

    .filter-body {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .filter-body.aberto { display: flex; }

    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-group label { font-size: 12px; font-weight: bold; color: #555; }
    .filter-group select, .filter-group input {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
    }

    .order-btn-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .order-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--line);
      background: #f9f9ff;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    .order-btn.active {
      background: var(--p);
      color: white;
      border-color: var(--p);
      font-weight: bold;
    }

    /* Botões Flutuantes */
    .btn-acessibilidade {
      position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px;
      border-radius: 50%; background: var(--p); color: white; border: none;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; transition: transform 0.2s;
    }
    .btn-acessibilidade:hover { transform: scale(1.1); }
    .menu-acessibilidade {
      position: fixed; bottom: 95px; right: 30px; background: white;
      border: 1px solid var(--line); border-radius: 16px; padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none;
      flex-direction: column; gap: 8px; z-index: 999; width: 200px;
    }
    .menu-acessibilidade.aberto { display: flex; }
    .menu-acessibilidade h4 { margin: 0 0 5px 0; font-size: 14px; color: #666; text-align: center; }
    .menu-acessibilidade button {
      background: #f4f4f8; border: none; padding: 10px; border-radius: 8px;
      cursor: pointer; font-weight: bold; color: var(--ink); text-align: left;
    }
    .menu-acessibilidade button:hover { background: #e0d4fc; }
  </style>
</head>
<body>
  <main class="phone app-shell">
    
    <!-- CABEÇALHO -->
    <header class="app-header">
      <a class="logo" href="index.html" aria-label="BuscaPet, início">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="6" cy="8" rx="2" ry="2.7"/><ellipse cx="11" cy="5" rx="2" ry="2.7"/><ellipse cx="17" cy="6" rx="2" ry="2.7"/><ellipse cx="20" cy="11" rx="1.8" ry="2.5"/><path d="M5 18c0-3 4-7 7-7s7 4 7 7c0 5-5 1-7 1s-7 4-7-1Z"/></svg>
        <span class="wordmark">Busca<strong>Pet</strong></span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg>Início</a>
        <a href="mapa.html" class="active"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z"/><path d="M9 3v16M15 5v16"/></svg>Mapa</a>
        <a href="cadastro.html" class="post-link"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>Publicar</a>
        <a href="minha-area.html"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg>Minha área</a>
      </nav>
    </header>

    <div class="page" style="padding: 0;">
      <div class="map-container">
        <div id="mapa"></div>
        
        <!-- Painel de Filtros (Flutuante) -->
        <div class="map-controls">
          <div class="filter-header" id="btn-toggle-filtros">
            <h3>Filtros e Ordenação</h3>
            <span>▼</span>
          </div>
          
          <div class="filter-body" id="filtros-body">
            <div class="filter-group">
              <label>Tipo de Alerta</label>
              <select id="filter-type">
                <option value="todos">Todos</option>
                <option value="perdido">Perdidos</option>
                <option value="encontrado">Encontrados</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Região</label>
              <select id="filter-region">
                <option value="todos">Todas as regiões</option>
                <option value="Centro">Centro</option>
                <option value="Leste">Leste</option>
                <option value="Bálsamo">Bálsamo</option>
                <option value="Taveirópolis">Taveirópolis</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Ordenar por</label>
              <div class="order-btn-group">
                <button class="order-btn active" data-order="recente">Mais Recentes</button>
                <button class="order-btn" data-order="antigo">Mais Antigos</button>
                <button class="order-btn" data-order="recompensa">Recompensa</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTÃO DE ACESSIBILIDADE -->
    <button class="btn-acessibilidade" id="btn-acessibilidade" aria-label="Abrir menu de acessibilidade">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
    </button>
    <div class="menu-acessibilidade" id="menu-acessibilidade">
      <h4>Acessibilidade</h4>
      <button type="button" data-action="text-size" data-value="smaller">A− Diminuir texto</button>
      <button type="button" data-action="text-size" data-value="larger">A+ Aumentar texto</button>
      <button type="button" data-action="contrast">◐ Alto contraste</button>
    </div>
  </main>

  <!-- Script do Mapa -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Acessibilidade
    const btnAcess = document.getElementById('btn-acessibilidade');
    const menuAcess = document.getElementById('menu-acessibilidade');
    if (btnAcess && menuAcess) {
      btnAcess.addEventListener('click', () => menuAcess.classList.toggle('aberto'));
      document.addEventListener('click', (e) => {
        if (!btnAcess.contains(e.target) && !menuAcess.contains(e.target)) menuAcess.classList.remove('aberto');
      });
      menuAcess.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          const value = btn.dataset.value;
          if (action === 'text-size') {
            if (value === 'larger') {
              document.documentElement.classList.remove('a11y-small-text');
              document.documentElement.classList.toggle('a11y-large-text');
            } else {
              document.documentElement.classList.remove('a11y-large-text');
              document.documentElement.classList.toggle('a11y-small-text');
            }
          } else if (action === 'contrast') {
            const enabled = document.documentElement.classList.toggle('a11y-high-contrast');
            btn.setAttribute('aria-pressed', String(enabled));
          }
        });
      });
    }

    // Lógica do Mapa e Filtros
    document.addEventListener('DOMContentLoaded', async () => {
      const mapa = L.map('mapa', { zoomControl: false }).setView([-20.4697, -54.6201], 12);
      L.control.zoom({ position: 'bottomright' }).addTo(mapa);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(mapa);

      let todosOsPets = [];
      let marcadores = [];
      let filtroAtivo = 'todos';
      let regiaoAtiva = 'todos';
      let ordemAtiva = 'recente';

      // Posições aproximadas
      const posicoes = {
        'Centro': [-20.465, -54.615],
        'Leste': [-20.450, -54.580],
        'Bálsamo': [-20.480, -54.650],
        'Taveirópolis': [-20.490, -54.630]
      };

      // Carrega dados do banco
      try {
        const response = await fetch('/api/pets');
        todosOsPets = await response.json();
        renderizarMapa();
      } catch (error) {
        console.error("Erro ao carregar mapa:", error);
      }

      // Função para desenhar os pinos no mapa
      function renderizarMapa() {
        // Limpa marcadores antigos
        marcadores.forEach(m => mapa.removeLayer(m));
        marcadores = [];

        // Filtra os pets
        let petsFiltrados = todosOsPets.filter(pet => {
          const matchTipo = filtroAtivo === 'todos' || pet.status === filtroAtivo;
          const matchRegiao = regiaoAtiva === 'todos' || pet.regiao === regiaoAtiva;
          return matchTipo && matchRegiao;
        });

        // Ordena
        petsFiltrados.sort((a, b) => {
          if (ordemAtiva === 'recente') return new Date(b.data_criacao) - new Date(a.data_criacao);
          if (ordemAtiva === 'antigo') return new Date(a.data_criacao) - new Date(b.data_criacao);
          if (ordemAtiva === 'recompensa') return (b.recompensa || 0) - (a.recompensa || 0);
          return 0;
        });

        // Desenha cada pet
        petsFiltrados.forEach(pet => {
          const posicao = posicoes[pet.regiao] || [-20.4697, -54.6201];
          
          // Ícone personalizado (Foto ou Emoji)
          let iconeHtml = '';
          if (pet.foto_url) {
            iconeHtml = `<img src="${pet.foto_url}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
          } else {
            iconeHtml = `<div style="font-size: 20px; display: flex; align-items: center; justify-content: center; height: 100%;">${pet.especie === 'gato' ? '🐈' : (pet.especie === 'cão' ? '🐶' : '🐾')}</div>`;
          }

          const customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<div style="width: 40px; height: 40px; border-radius: 50%; background: white; border: 3px solid ${pet.status === 'encontrado' ? '#18735c' : 'var(--p)'}; box-shadow: 0 3px 10px rgba(0,0,0,0.3); overflow: hidden; display: flex; align-items: center; justify-content: center;">${iconeHtml}</div>`,
            iconSize: [40, 40],
            iconAnchor: [20, 40]
          });

          // Cria o marcador
          const marcador = L.marker(posicao, { icon: customIcon }).addTo(mapa);
          
          // Popup
          const popupHtml = `
            <div style="text-align: center; min-width: 150px;">
              <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 10px auto; border: 3px solid ${pet.status === 'encontrado' ? '#18735c' : 'var(--p)'};">
                ${pet.foto_url 
                  ? `<img src="${pet.foto_url}" style="width: 100%; height: 100%; object-fit: cover;">` 
                  : `<div style="background: #eee; font-size: 40px; display: flex; align-items: center; justify-content: center; height: 100%;">${pet.especie === 'gato' ? '🐈' : (pet.especie === 'cão' ? '🐶' : '🐾')}</div>`
                }
              </div>
              <b style="font-size: 16px; display: block;">${pet.nome}</b>
              <span style="font-size: 12px; color: #666;">${pet.raca || pet.especie}</span><br>
              <span style="font-size: 12px; color: ${pet.status === 'encontrado' ? '#18735c' : 'var(--p)'}; font-weight: bold;">${pet.status === 'encontrado' ? 'ENCONTRADO' : 'PERDIDO'}</span><br>
              <a href="detalhe.html?id=${pet.id}" style="display: inline-block; margin-top: 8px; color: var(--p); font-weight: bold; font-size: 12px; text-decoration: none;">Ver detalhes ↗</a>
            </div>
          `;
          marcador.bindPopup(popupHtml);

          // Esfera de área (Círculo)
          const circle = L.circle(posicao, {
            color: pet.status === 'encontrado' ? '#18735c' : '#6d28e8',
            fillColor: pet.status === 'encontrado' ? '#18735c' : '#6d28e8',
            fillOpacity: 0.1,
            radius: 800, // Raio de 800 metros
            weight: 1
          }).addTo(mapa);

          marcadores.push(marcador, circle);
        });
      }

      // --- Lógica do Painel de Filtros ---
      const btnToggle = document.getElementById('btn-toggle-filtros');
      const bodyFiltros = document.getElementById('filtros-body');

      btnToggle.addEventListener('click', () => {
        btnToggle.classList.toggle('aberto');
        bodyFiltros.classList.toggle('aberto');
      });

      document.getElementById('filter-type').addEventListener('change', (e) => {
        filtroAtivo = e.target.value;
        renderizarMapa();
      });

      document.getElementById('filter-region').addEventListener('change', (e) => {
        regiaoAtiva = e.target.value;
        renderizarMapa();
      });

      document.querySelectorAll('.order-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.order-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          ordemAtiva = btn.dataset.order;
          renderizarMapa();
        });
      });

    });
  </script>
</body>
</html>
