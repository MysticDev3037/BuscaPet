<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuscaPet | Mapa</title>
  <link rel="stylesheet" href="style.css" />
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    .map-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 100px);
      margin-top: 10px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      position: relative;
    }
    #mapa { flex: 1; width: 100%; z-index: 1; }

    /* Painel de Filtros Lateral (Gaveta) */
    .map-controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      z-index: 400;
      overflow: hidden;
      width: 280px;
      max-width: calc(100vw - 40px);
    }
    
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: var(--p);
      color: white;
      cursor: pointer;
    }
    .filter-header h3 { margin: 0; font-size: 14px; font-weight: bold; }
    .filter-header span { font-size: 14px; transition: transform 0.2s; }
    .filter-header.aberto span { transform: rotate(180deg); }

    .filter-body {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 15px;
      background: white;
    }
    .filter-body.aberto { display: flex; }

    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-group label { font-size: 12px; font-weight: bold; color: #555; }
    .filter-group select { 
      padding: 8px; 
      border: 1px solid var(--line); 
      border-radius: 8px; 
      font-size: 13px; 
      color: var(--ink);
      background: #f9f9ff;
    }

    .order-btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
    .order-btn {
      flex: 1; padding: 6px; border: 1px solid var(--line); background: #f9f9ff;
      border-radius: 6px; font-size: 11px; cursor: pointer; text-align: center;
      white-space: nowrap; color: #555;
    }
    .order-btn.active { background: var(--p); color: white; border-color: var(--p); font-weight: bold; }

    /* Spinner de carregamento */
    .loading-overlay {
      position: absolute; inset: 0; background: rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; font-weight: bold; color: var(--p); font-size: 18px;
    }
    
    .btn-acessibilidade {
      position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px;
      border-radius: 50%; background: var(--p); color: white; border: none;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; transition: transform 0.2s;
    }
    .menu-acessibilidade {
      position: fixed; bottom: 95px; right: 30px; background: white;
      border: 1px solid var(--line); border-radius: 16px; padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none;
      flex-direction: column; gap: 8px; z-index: 999; width: 200px;
    }
    .menu-acessibilidade.aberto { display: flex; }
    .menu-acessibilidade button {
      background: #f4f4f8; border: none; padding: 10px; border-radius: 8px;
      cursor: pointer; font-weight: bold; color: var(--ink); text-align: left;
    }
  </style>
</head>
<body>
  <main class="phone app-shell">
    
    <header class="app-header">
      <a class="logo" href="index.html">🐾 Busca<strong>Pet</strong></a>
      <nav class="main-nav">
        <a href="index.html">Início</a>
        <a href="mapa.html" class="active">Mapa</a>
        <a href="cadastro.html" class="post-link">+ Publicar</a>
        <a href="minha-area.html">Minha área</a>
      </nav>
    </header>

    <div class="page" style="padding: 0;">
      <div class="map-container">
        <div id="mapa"></div>
        <div id="loading" class="loading-overlay" style="display: none;">Buscando localizações reais...</div>
        
        <!-- Painel de Filtros -->
        <div class="map-controls">
          <div class="filter-header" id="btn-toggle-filtros">
            <h3>Filtros</h3>
            <span>▼</span>
          </div>
          
          <div class="filter-body" id="filtros-body">
            <div class="filter-group">
              <label>Tipo de Alerta</label>
              <select id="filter-type">
                <option value="todos">Todos</option>
                <option value="perdido">Perdidos</option>
                <option value="encontrado">Encontrados</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Região</label>
              <select id="filter-region">
                <option value="todos">Todas as regiões</option>
                <option value="Centro">Centro</option>
                <option value="Leste">Leste</option>
                <option value="Bálsamo">Bálsamo</option>
                <option value="Taveirópolis">Taveirópolis</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Ordenar por</label>
              <div class="order-btn-group">
                <button class="order-btn active" data-order="recente">Recentes</button>
                <button class="order-btn" data-order="antigo">Antigos</button>
                <button class="order-btn" data-order="recompensa">Recompensa</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button class="btn-acessibilidade" id="btn-acessibilidade">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
    </button>
    <div class="menu-acessibilidade" id="menu-acessibilidade">
      <h4>Acessibilidade</h4>
      <button type="button" data-action="text-size" data-value="smaller">A− Diminuir texto</button>
      <button type="button" data-action="text-size" data-value="larger">A+ Aumentar texto</button>
      <button type="button" data-action="contrast">◐ Alto contraste</button>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Lógica de Acessibilidade
    const btnAcess = document.getElementById('btn-acessibilidade');
    const menuAcess = document.getElementById('menu-acessibilidade');
    if (btnAcess && menuAcess) {
      btnAcess.addEventListener('click', () => menuAcess.classList.toggle('aberto'));
      document.addEventListener('click', (e) => {
        if (!btnAcess.contains(e.target) && !menuAcess.contains(e.target)) menuAcess.classList.remove('aberto');
      });
      menuAcess.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          const value = btn.dataset.value;
          if (action === 'text-size') {
            if (value === 'larger') {
              document.documentElement.classList.remove('a11y-small-text');
              document.documentElement.classList.toggle('a11y-large-text');
            } else {
              document.documentElement.classList.remove('a11y-large-text');
              document.documentElement.classList.toggle('a11y-small-text');
            }
          } else if (action === 'contrast') {
            const enabled = document.documentElement.classList.toggle('a11y-high-contrast');
            btn.setAttribute('aria-pressed', String(enabled));
          }
        });
      });
    }

    // Lógica Principal do Mapa
    document.addEventListener('DOMContentLoaded', async () => {
      const mapa = L.map('mapa', { zoomControl: false }).setView([-20.4697, -54.6201], 12);
      L.control.zoom({ position: 'bottomright' }).addTo(mapa);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(mapa);

      let todosOsPets = [];
      let marcadores = [];
      let filtroAtivo = 'todos';
      let regiaoAtiva = 'todos';
      let ordemAtiva = 'recente';

      async function buscarCoordenadas(endereco) {
        try {
          const query = encodeURIComponent(`${endereco}, Campo Grande, MS, Brasil`);
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`;
          const response = await fetch(url, { headers: { 'User-Agent': 'BuscaPet-Faculdade/1.0' } });
          const data = await response.json();
          if (data && data.length > 0) {
            return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
          }
        } catch (error) { console.error("Erro na geolocalização:", error); }
        return [-20.4697, -54.6201];
      }

      async function renderizarMapa() {
        marcadores.forEach(m => mapa.removeLayer(m));
        marcadores = [];
        document.getElementById('loading').style.display = 'flex';

        let petsFiltrados = todosOsPets.filter(pet => {
          const matchTipo = filtroAtivo === 'todos' || pet.status === filtroAtivo;
          const matchRegiao = regiaoAtiva === 'todos' || pet.regiao === regiaoAtiva;
          return matchTipo && matchRegiao;
        });

        petsFiltrados.sort((a, b) => {
          if (ordemAtiva === 'recente') return new Date(b.data_criacao) - new Date(a.data_criacao);
          if (ordemAtiva === 'antigo') return new Date(a.data_criacao) - new Date(b.data_criacao);
          if (ordemAtiva === 'recompensa') return (b.recompensa || 0) - (a.recompensa || 0);
          return 0;
        });

        for (const pet of petsFiltrados) {
          const enderecoBusca = `${pet.bairro || ''} ${pet.regiao || ''} ${pet.cidade || ''}`.trim();
          const posicao = await buscarCoordenadas(enderecoBusca);

          let iconeHtml = pet.foto_url 
            ? `<img src="${pet.foto_url}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`
            : `<div style="font-size: 20px; display: flex; align-items: center; justify-content: center; height: 100%;">${pet.especie === 'gato' ? '🐈' : (pet.especie === 'cão' ? '🐶' : '🐾')}</div>`;

          const customIcon = L.divIcon({
            className: 'custom-marker',
            html: `<div style="width: 40px; height: 40px; border-radius: 50%; background: white; border: 3px solid ${pet.status === 'encontrado' ? '#18735c' : 'var(--p)'}; box-shadow: 0 3px 10px rgba(0,0,0,0.3); overflow: hidden; display: flex; align-items: center; justify-content: center;">${iconeHtml}</div>`,
            iconSize: [40, 40],
            iconAnchor: [20, 40]
          });

          const marcador = L.marker(posicao, { icon: customIcon }).addTo(mapa);
          
          const popupHtml = `
            <div style="text-align: center; min-width: 150px;">
              <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin: 0 auto 10px auto; border: 3px solid ${pet.status === 'encontrado' ? '#18735c' : 'var(--p)'};">
                ${pet.foto_url ? `<img src="${pet.foto_url}" style="width: 100%; height: 100%; object-fit: cover;">` : `<div style="background: #eee; font-size: 40px; display: flex; align-items: center; justify-content: center; height: 100%;">${pet.especie === 'gato' ? '🐈' : '🐶'}</div>`}
              </div>
              <b style="font-size: 16px; display: block;">${pet.nome}</b>
              <span style="font-size: 12px; color: #666;">${pet.raca || pet.especie}</span><br>
              <span style="font-size: 12px; color: ${pet.status === 'encontrado' ? '#18735c' : 'var(--p)'}; font-weight: bold;">${pet.status.toUpperCase()}</span><br>
              <a href="detalhe.html?id=${pet.id}" style="display: inline-block; margin-top: 8px; color: var(--p); font-weight: bold; font-size: 12px; text-decoration: none;">Ver detalhes ↗</a>
            </div>
          `;
          marcador.bindPopup(popupHtml);

          const circle = L.circle(posicao, {
            color: pet.status === 'encontrado' ? '#18735c' : '#6d28e8',
            fillColor: pet.status === 'encontrado' ? '#18735c' : '#6d28e8',
            fillOpacity: 0.1,
            radius: 800,
            weight: 1
          }).addTo(mapa);

          marcadores.push(marcador, circle);
        }
        document.getElementById('loading').style.display = 'none';
      }

      try {
        const response = await fetch('/api/pets');
        todosOsPets = await response.json();
        await renderizarMapa();
      } catch (error) {
        console.error("Erro ao carregar mapa:", error);
        document.getElementById('loading').style.display = 'none';
      }

      document.getElementById('btn-toggle-filtros').addEventListener('click', () => {
        document.getElementById('btn-toggle-filtros').classList.toggle('aberto');
        document.getElementById('filtros-body').classList.toggle('aberto');
      });

      document.getElementById('filter-type').addEventListener('change', (e) => { filtroAtivo = e.target.value; renderizarMapa(); });
      document.getElementById('filter-region').addEventListener('change', (e) => { regiaoAtiva = e.target.value; renderizarMapa(); });
      
      document.querySelectorAll('.order-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.order-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          ordemAtiva = btn.dataset.order;
          renderizarMapa();
        });
      });
    });
  </script>
</body>
</html>
