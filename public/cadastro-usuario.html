<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuscaPet | Cadastro</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 40px; }
    .toggle-password {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px; color: #777;
    }
    .error-msg { color: #a82442; font-size: 12px; margin-top: 4px; display: none; }
    .error-msg.show { display: block; }
    .success-msg { color: #18735c; font-size: 12px; margin-top: 4px; display: none; }
    .success-msg.show { display: block; }
    .foto-preview-container {
      display: flex; align-items: center; gap: 15px; margin-top: 10px;
    }
    .foto-preview {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      background: #eee; border: 2px solid var(--line); display: none;
    }
    .foto-preview.show { display: block; }
  </style>
  
</head>
<body>
  <main class="phone app-shell">
    
    <header class="app-header">
      <a class="logo" href="index.html">🐾 Busca<strong>Pet</strong></a>
      <nav class="main-nav">
        <a href="index.html">Início</a>
        <a href="mapa.html">Mapa</a>
        <a href="cadastro.html" class="post-link">+ Publicar</a>
        <a href="login.html">Minha Área</a>
      </nav>
    </header>

    <div class="page login-page signup-page">
      <section class="login-panel login-panel-signup">
        <h1>Cadastro de tutor de pet</h1>
        <p class="intro">Crie seu próprio acesso como responsável por um animal.</p>

        <form id="form-cadastro" class="form signup-form">
          
          <!-- Aviso removido daqui -->

          <div class="form-grid identity-fields">
            <p class="form-section-title full">Identificação e contato</p>
            
            <label>Nome completo *
              <input class="control" type="text" id="nome" required placeholder="Ex.: Ana Maria da Silva">
            </label>
            <label>E-mail *
              <input class="control" type="email" id="email" required placeholder="nome@exemplo.com">
            </label>
            <label>CPF *
              <input class="control" type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
              <span id="cpf-error" class="error-msg">CPF inválido.</span>
            </label>
            <label>Data de Nascimento *
              <input class="control" type="date" id="data-nascimento" required>
            </label>
            <label>Telefone com DDD *
              <input class="control" type="tel" id="telefone" required placeholder="(67) 99999-9999" maxlength="15">
            </label>

            <label class="full">Foto de perfil (opcional)
              <input class="control" type="file" id="foto-input" accept="image/*">
              <div class="foto-preview-container">
                <img id="foto-preview" class="foto-preview" alt="Prévia da foto">
                <span class="hint">Escolha uma foto sua ou do seu pet. JPG, PNG.</span>
              </div>
            </label>

            <p class="form-section-title full">Endereço completo</p>
            
            <label>CEP *
              <input class="control" type="text" id="cep" required placeholder="79000-000" maxlength="9">
              <span id="cep-status" class="success-msg">CEP encontrado!</span>
            </label>
            <label>Rua / Avenida *
              <input class="control" type="text" id="rua" required>
            </label>
            <label>Número *
              <input class="control" type="text" id="numero" required>
            </label>
            <label>Complemento
              <input class="control" type="text" id="complemento" placeholder="Apto, bloco (opcional)">
            </label>
            <label>Bairro *
              <input class="control" type="text" id="bairro" required>
            </label>
            <label>Cidade *
              <input class="control" type="text" id="cidade" required>
            </label>
            <label>Estado (UF) *
              <input class="control" type="text" id="estado" required maxlength="2" placeholder="MS">
            </label>
          </div>

          <p class="form-section-title">Criar senha</p>
          
          <label>Senha *
            <div class="password-wrapper">
              <input class="control" type="password" id="senha" required minlength="8" placeholder="Mínimo 8 caracteres">
              <button type="button" class="toggle-password" onclick="toggleSenha('senha', this)">👁️</button>
            </div>
            <span id="senha-forca" class="error-msg" style="color: #777;">Use 8+ caracteres, maiúscula, minúscula, número e símbolo.</span>
          </label>

          <label>Repita a senha *
            <div class="password-wrapper">
              <input class="control" type="password" id="confirmar-senha" required placeholder="Digite a senha novamente">
              <button type="button" class="toggle-password" onclick="toggleSenha('confirmar-senha', this)">👁️</button>
            </div>
            <span id="senha-erro" class="error-msg">As senhas não coincidem.</span>
          </label>

          <div class="actions signup-actions">
            <button type="submit" class="btn primary">Cadastrar perfil</button>
            <a href="login.html" class="btn secondary">Voltar para entrar</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script>
    let fotoBase64 = "";

    // Prévia da Foto com Proteção
    document.getElementById('foto-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // PROTEÇÃO 1: Limite de tamanho (2MB)
      if (file.size > 2 * 1024 * 1024) {
        alert('A foto é muito grande. Escolha uma imagem de até 2MB.');
        e.target.value = ''; // Limpa o campo
        return;
      }

      // PROTEÇÃO 2: Tipos de arquivo permitidos
      const tiposPermitidos = ['image/jpeg', 'image/png', 'image/webp'];
      if (!tiposPermitidos.includes(file.type)) {
        alert('Formato inválido. Envie apenas JPG, PNG ou WebP.');
        e.target.value = '';
        return;
      }

      // Se passou nas proteções, mostra a prévia
      const reader = new FileReader();
      reader.onload = (event) => {
        fotoBase64 = event.target.result;
        const preview = document.getElementById('foto-preview');
        preview.src = fotoBase64;
        preview.classList.add('show');
      };
      reader.readAsDataURL(file);
    });

    // Máscaras
    document.getElementById('cpf').addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    document.getElementById('telefone').addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '');
      v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
      v = v.replace(/(\d)(\d{4})$/, '$1-$2');
      e.target.value = v;
    });

    // Busca CEP
    document.getElementById('cep').addEventListener('blur', async (e) => {
      const cep = e.target.value.replace(/\D/g, '');
      if (cep.length === 8) {
        try {
          const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
          const data = await res.json();
          if (!data.erro) {
            document.getElementById('rua').value = data.logradouro;
            document.getElementById('bairro').value = data.bairro;
            document.getElementById('cidade').value = data.localidade;
            document.getElementById('estado').value = data.uf;
            document.getElementById('cep-status').classList.add('show');
            setTimeout(() => document.getElementById('cep-status').classList.remove('show'), 3000);
          }
        } catch (error) {
          console.log("Erro ao buscar CEP");
        }
      }
    });

    // Olho Mágico
    function toggleSenha(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // Validação de Força da Senha
    const senhaInput = document.getElementById('senha');
    const confirmarInput = document.getElementById('confirmar-senha');
    const senhaErro = document.getElementById('senha-erro');
    const senhaForca = document.getElementById('senha-forca');

    senhaInput.addEventListener('input', () => {
      const val = senhaInput.value;
      // Regex: 8+ caracteres, 1 maiúscula, 1 minúscula, 1 número, 1 símbolo
      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
      
      if (regex.test(val)) {
        senhaForca.style.color = '#18735c';
        senhaForca.textContent = 'Senha forte! ✔️';
      } else {
        senhaForca.style.color = '#a82442';
        senhaForca.textContent = 'Fraca: use 8+ caracteres, maiúscula, minúscula, número e símbolo.';
      }
    });

    confirmarInput.addEventListener('input', () => {
      if (confirmarInput.value !== senhaInput.value) {
        senhaErro.classList.add('show');
      } else {
        senhaErro.classList.remove('show');
      }
    });

    // Validação de CPF
    function validaCPF(cpf) {
      cpf = cpf.replace(/\D/g, '');
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;
      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i-1, i)) * (11 - i);
      resto = (soma * 10) % 11;
      if ((resto === 10) || (resto === 11)) resto = 0;
      if (resto !== parseInt(cpf.substring(9, 10))) return false;
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i-1, i)) * (12 - i);
      resto = (soma * 10) % 11;
      if ((resto === 10) || (resto === 11)) resto = 0;
      if (resto !== parseInt(cpf.substring(10, 11))) return false;
      return true;
    }

    // Envio do Formulário
    document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
      e.preventDefault();

     
       // 1. Valida CPF (Desativado para aceitar dados fictícios)
      const cpfValue = document.getElementById('cpf').value;
      // A validação foi removida. Agora aceita qualquer valor.
      // 2. Valida se as senhas são iguais
      <!-- <span id="cpf-error" class="error-msg">CPF inválido.</span> -->
      if (senhaInput.value !== confirmarInput.value) {
        senhaErro.classList.add('show');
        return;
      }

      // 3. Valida a força da senha (bloqueia o cadastro se for fraca)
      const regexSenha = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
      if (!regexSenha.test(senhaInput.value)) {
        alert('A senha está fraca. Ela precisa ter 8+ caracteres, letra maiúscula, letra minúscula, número e símbolo (ex: @, #, $).');
        return;
      }

      // 4. Envia para o servidor
      const novoUsuario = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: senhaInput.value,
        cpf: cpfValue,
        data_nascimento: document.getElementById('data-nascimento').value,
        telefone: document.getElementById('telefone').value,
        foto_perfil: fotoBase64,
        cep: document.getElementById('cep').value,
        rua: document.getElementById('rua').value,
        numero: document.getElementById('numero').value,
        complemento: document.getElementById('complemento').value,
        bairro: document.getElementById('bairro').value,
        cidade: document.getElementById('cidade').value,
        estado: document.getElementById('estado').value
      };

      try {
        const response = await fetch('/api/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(novoUsuario)
        });

        const data = await response.json();

        if (response.ok) {
          alert('Cadastro realizado com sucesso! Faça login.');
          window.location.href = 'login.html';
        } else {
          alert(data.erro || 'Erro ao cadastrar.');
        }
      } catch (error) {
        console.error(error);
        alert('Erro de conexão.');
      }
    });
  </script>
</body>
</html>
