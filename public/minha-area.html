<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuscaPet | Encontre, ajude, conecte</title>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    .btn-acessibilidade {
      position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px;
      border-radius: 50%; background: var(--p); color: white; border: none;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; transition: transform 0.2s;
    }
    .btn-acessibilidade:hover { transform: scale(1.1); }
    .menu-acessibilidade {
      position: fixed; bottom: 95px; right: 30px; background: white;
      border: 1px solid var(--line); border-radius: 16px; padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: none;
      flex-direction: column; gap: 8px; z-index: 999; width: 200px;
    }
    .menu-acessibilidade.aberto { display: flex; }
    .menu-acessibilidade h4 { margin: 0 0 5px 0; font-size: 14px; color: #666; text-align: center; }
    .menu-acessibilidade button {
      background: #f4f4f8; border: none; padding: 10px; border-radius: 8px;
      cursor: pointer; font-weight: bold; color: var(--ink); text-align: left;
    }
    .menu-acessibilidade button:hover { background: #e0d4fc; }

    .float-btn {
      position: fixed; width: 55px; height: 55px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000; transition: transform 0.2s; text-decoration: none;
    }
    .float-btn:hover { transform: scale(1.1); }
    .btn-favoritos-float { bottom: 100px; right: 30px; background: #e11d48; }
  </style>
</head>
<body>
  <main class="phone app-shell">
    
    <a class="skip-link" href="#home">Pular para o conteúdo</a>
    <header class="app-header">
      <a class="logo" href="index.html" aria-label="BuscaPet, início">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="6" cy="8" rx="2" ry="2.7"/><ellipse cx="11" cy="5" rx="2" ry="2.7"/><ellipse cx="17" cy="6" rx="2" ry="2.7"/><ellipse cx="20" cy="11" rx="1.8" ry="2.5"/><path d="M5 18c0-3 4-7 7-7s7 4 7 7c0 5-5 1-7 1s-7 4-7-1Z"/></svg>
        <span class="wordmark">Busca<strong>Pet</strong></span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html" class="active"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg>Início</a>
        <a href="mapa.html"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z"/><path d="M9 3v16M15 5v16"/></svg>Mapa</a>
        <a href="cadastro.html" class="post-link"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>Publicar</a>
        <a href="favoritos.html"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.8 4.7a5.4 5.4 0 0 0-7.6 0L12 5.9l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.7a5.4 5.4 0 0 0 0-7.6Z"/></svg>Favoritos</a>
        <a href="minha-area.html"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg>Minha área</a>
      </nav>
      <div class="header-links">
        <a href="servicos.html">Rede de apoio</a>
        <span class="mode-pill">Tutor de pet</span>
      </div>
    </header>

    <div class="page catalog-page">
      <div class="catalog-intro">
        <div>
          <p class="eyebrow">ENCONTRAR COMEÇA POR CONECTAR</p>
          <h1>Quem você pode ajudar hoje?</h1>
          <p class="intro">Uma foto, uma pista, um reencontro. Faça parte dessa busca.</p>
        </div>
        <a class="btn primary publish-desktop" href="cadastro.html">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg> Publicar alerta
        </a>
      </div>

      <div class="browse-layout">
        <aside class="browse-sidebar">
          <label class="search">
            <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <input id="search-input" type="text" placeholder="Nome, raça ou cidade...">
          </label>
          
          <div class="filters-panel">
            <h3 style="margin-top:0; font-size:14px;">Filtrar alertas</h3>
            <div class="filter-controls">
              <label>Tipo de alerta
                <select id="filter-type">
                  <option value="todos">Todos os alertas</option>
                  <option value="perdido">Perdidos</option>
                  <option value="encontrado">Encontrados</option>
                </select>
              </label>
              <label>Região
                <select id="filter-region">
                  <option value="todos">Todas as regiões</option>
                  <option value="Centro">Centro</option>
                  <option value="Leste">Leste</option>
                  <option value="Bálsamo">Bálsamo</option>
                </select>
              </label>
            </div>
          </div>
        </aside>

        <div class="browse-results">
          <div class="catalog-toolbar">
            <div class="chips" role="group" aria-label="Filtrar por espécie">
              <button class="on" data-especie="todos">Todos</button>
              <button data-especie="cão">Cães</button>
              <button data-especie="gato">Gatos</button>
              <button data-especie="outro">Outros</button>
            </div>
            <span id="result-count" role="status" aria-live="polite">Carregando...</span>
          </div>
          
          <div id="results" class="list alert-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- BOTÕES FLUTUANTES -->
  <a href="favoritos.html" class="float-btn btn-favoritos-float" title="Meus Favoritos">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.7a5.4 5.4 0 0 0-7.6 0L12 5.9l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.7a5.4 5.4 0 0 0 0-7.6Z"/></svg>
  </a>

  <button class="btn-acessibilidade" id="btn-acessibilidade" aria-label="Abrir menu de acessibilidade">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
  </button>
  <div class="menu-acessibilidade" id="menu-acessibilidade">
    <h4>Acessibilidade</h4>
    <button type="button" data-action="text-size" data-value="smaller">A− Diminuir texto</button>
    <button type="button" data-action="text-size" data-value="larger">A+ Aumentar texto</button>
    <button type="button" data-action="contrast">◐ Alto contraste</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
